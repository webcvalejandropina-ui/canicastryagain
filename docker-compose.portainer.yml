# Stack para Portainer: Canicas Try Again
# La configuración (puertos, env, volumen) se gestiona desde Portainer.

services:
  canicas:
    image: canicas-try-again:latest
    container_name: canicas
    restart: unless-stopped
    init: true
    cpus: "1.0"
    mem_limit: 512m
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "13000:3000"
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      NODE_OPTIONS: --max-old-space-size=320
      GAME_STREAM_LIMIT: ${GAME_STREAM_LIMIT:-1000}
      PORT: "3000"
      SQLITE_PATH: /app/data/game.db
    volumes:
      - canicas_data:/app/data

volumes:
  canicas_data:
